general {
    fractional_scaling = 2
}

# Cores vindas do tema Omarchy atual (Monster: osso + vermelho-sangue)
source = ~/.config/omarchy/current/theme/hyprlock.conf

background {
    monitor =
    path = ~/.config/omarchy/current/background
    color = $color

    blur_size = 3
    blur_passes = 2
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.5500
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# --- RELÓGIO (HH:MM numa linha só) ---
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color = $font_color
    font_size = 96
    font_family = JetBrainsMono Nerd Font Propo
    shadow_passes = 0
    shadow_size = 0

    position = 0, 70
    halign = center
    valign = center
}

# --- DATA (dia da semana + data, numa linha) ---
label {
    monitor =
    text = cmd[update:18000000] echo "$(date +'%A, %d %b')"
    color = rgba(205, 195, 180, 0.80)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Propo

    position = 0, -10
    halign = center
    valign = center
}

# --- SAUDAÇÃO ---
label {
    monitor =
    # Se hora < 12: Bom dia; < 18: Boa tarde; Senão: Boa noite.
    text = cmd[update:3600000] echo "<b>$(date +%H | awk '{if ($1 < 12) print "Bom dia"; else if ($1 < 18) print "Boa tarde"; else print "Boa noite"}'), $USER</b>"
    color = $font_color
    font_size = 15
    font_family = JetBrainsMono Nerd Font Propo

    position = 0, -45
    halign = center
    valign = center
}

# --- FRASE ---
label {
    monitor =
    text = cmd[update:600000] echo "$(shuf -e 'Foco no processo.' 'Um dia de cada vez.' 'Você é capaz.' 'Continue codando.' 'Respire fundo.' 'A persistência é o caminho.' -n 1)"
    color = rgba(205, 195, 180, 0.50)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Propo

    position = 0, -78
    halign = center
    valign = center
}

# --- ÍCONE CADEADO ---
label {
    monitor =
    text = 󰌾
    color = $outer_color
    font_size = 16
    font_family = JetBrainsMono Nerd Font Propo

    position = 0, 180
    halign = center
    valign = bottom
}

# --- CAMPO DE SENHA ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3

    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true

    rounding = 22
    outer_color = $outer_color
    inner_color = $inner_color
    font_color = $font_color
    check_color = $check_color
    fail_color = $check_color
    fade_on_empty = true
    placeholder_text = Digite a senha

    position = 0, 110
    halign = center
    valign = bottom
}
