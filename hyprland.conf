# This file is not a full hyprland configuration.
# It is intended to be included in your main hyprland.conf.
# (As animações continuam vindo da config global do Omarchy — iguais ao exemplo.)
# Rounding fica a cargo do looknfeel global para não destoar do sistema.

general {
    # Borda ativa em gradiente: escuro -> sangue -> vermelho (estilo Monster)
    col.active_border = rgba(15110fee) rgba(9e1b1bee) rgba(c0392bee) 90deg
    col.inactive_border = rgb(2a221e)
}

group {
    col.border_active = rgba(c0392bee) rgba(9e1b1bee) 45deg
    col.border_inactive = rgb(15110f)

    groupbar {
        col.active = rgba(c0392bdd)
        col.inactive = rgba(15110faa)
        text_color = rgb(15110f)
        text_color_inactive = rgba(cdc3b4aa)
    }
}

decoration {
    shadow {
        enabled = yes
        range = 16
        color = rgba(00000066)
    }
}
